<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posvibe Clinic Pro - Enterprise Medical SaaS & EHR System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdf4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a'
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a'
            },
            medical: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            urdu: ['Noto Nastaliq Urdu', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- FontAwesome & Chart.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');

    .rtl {
      direction: rtl;
      font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
    }

    .rtl .sidebar-icon {
      margin-left: 0.75rem;
      margin-right: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Print Stylesheet */
    @media print {
      body * {
        visibility: hidden;
      }

      #printable-area,
      #printable-area * {
        visibility: visible;
      }

      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
      }

      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

<body class="h-full text-slate-800 dark:text-slate-100 dark:bg-slate-900 antialiased flex flex-col font-sans transition-colors duration-200" id="app-body">

  <!-- LOGIN / AUTHENTICATION OVERLAY MODAL -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700 relative">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-gradient-to-tr from-teal-600 to-medical-500 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3 shadow-lg">
          <i class="fa-solid fa-user-md"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 dark:text-white">Welcome to Posvibe Clinic Pro</h2>
        <p class="text-xs text-slate-500 mt-1">Enterprise Medical Management System</p>
      </div>

      <!-- Login / Signup Tabs -->
      <div class="flex border-b border-slate-200 dark:border-slate-700 mb-4">
        <button id="tab-login-btn" onclick="app.switchAuthTab('login')" class="flex-1 pb-2 text-xs font-bold text-teal-600 border-b-2 border-teal-600">Login</button>
        <button id="tab-signup-btn" onclick="app.switchAuthTab('signup')" class="flex-1 pb-2 text-xs font-bold text-slate-400 hover:text-slate-600">Register Staff / Doctor</button>
      </div>

      <!-- Login Form -->
      <form id="auth-login-form" onsubmit="app.handleLogin(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Email Address / Username</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="login-email" value="admin@posvibeclinic.pk" required class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-teal-600 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400"></i>
            <input type="password" id="login-password" value="demo123" required class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-teal-600 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Login Role</label>
          <select id="login-role" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg font-medium">
            <option value="Super Admin">Super Admin</option>
            <option value="Clinic Owner">Clinic Owner</option>
            <option value="Doctor">Doctor / Consultant</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Nurse">Nurse Staff</option>
            <option value="Lab Technician">Lab Technician</option>
            <option value="Pharmacist">Pharmacist</option>
            <option value="Accountant">Accountant</option>
          </select>
        </div>
        <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-md transition">
          Sign In to Portal
        </button>
      </form>

      <!-- Signup Form -->
      <form id="auth-signup-form" onsubmit="app.handleSignup(event)" class="hidden space-y-3 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Full Name *</label>
          <input type="text" id="signup-name" placeholder="Dr. Ali Ahmed" required class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Role *</label>
          <select id="signup-role" onchange="app.toggleDoctorSignupFields(this.value)" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg font-medium">
            <option value="Doctor">Doctor / Specialist</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Nurse">Nurse</option>
            <option value="Lab Technician">Lab Tech</option>
            <option value="Pharmacist">Pharmacist</option>
            <option value="Accountant">Accountant</option>
          </select>
        </div>
        <div id="doctor-signup-extra" class="space-y-2 border-t pt-2">
          <div>
            <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Qualification & Specialty</label>
            <input type="text" id="signup-qual" placeholder="MBBS, FCPS (Internal Med)" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Department</label>
              <input type="text" id="signup-dept" placeholder="General Med" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Consult Fee (PKR)</label>
              <input type="number" id="signup-fee" value="2500" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
            </div>
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Email Address *</label>
          <input type="email" id="signup-email" required class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Password *</label>
          <input type="password" id="signup-password" required class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
        </div>
        <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-md transition">
          Create Account & Register
        </button>
      </form>
    </div>
  </div>

      <button id="toggle-sidebar" onclick="app.toggleSidebar()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 md:hidden">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-2">

        </div>
        <div>
          <span class="text-lg font-bold text-slate-800 dark:text-white tracking-tight flex items-center gap-1.5">
            Posvibe Clinic <span class="bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300 text-xs px-2 py-0.5 rounded-full font-semibold">Pro v3.2</span>
          </span>
          <p class="text-xs text-slate-500 dark:text-slate-400" id="current-branch-display"><i class="fa-solid fa-hospital-user text-teal-600 mr-1"></i> Main Branch - Lahore HQ</p>
        </div>
      </div>
    </div>

        </select>
      </div>

        <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=120" alt="Profile" class="w-8 h-8 rounded-full object-cover border border-teal-600">

          <p class="text-xs font-semibold text-slate-800 dark:text-slate-100 leading-tight" id="active-user-name">Dr. Sarah Khan</p>

        </div>
        <button onclick="app.logout()" title="Sign Out" class="p-1.5 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-lg text-xs ml-1">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->

    <!-- SIDEBAR NAVIGATION -->
    <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 transition-all duration-300 absolute md:relative z-10 h-full -translate-x-full md:translate-x-0">

          <div class="flex justify-between items-center text-slate-400 mb-1">
            <span>Today's Target</span>
            <span class="text-teal-400 font-bold">84%</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-1.5">
            <div class="bg-teal-500 h-1.5 rounded-full" style="width: 84%"></div>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100 dark:bg-slate-900/60 space-y-6" id="main-content">
      <!-- Dynamic Module Content Rendering Container -->
    </main>
  </div>

    <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto border border-slate-200 dark:border-slate-700 p-6 relative">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- PRINTABLE TEMPLATE HIDDEN CONTAINER -->
  <div id="printable-area" class="hidden bg-white text-slate-900 p-8"></div>

                    <input type="text" value="1 tablet Once Daily" class="p-1.5 border rounded dark:bg-slate-700">
                    <input type="text" value="30 Days" class="p-1.5 border rounded dark:bg-slate-700">
                  </div>
                </div>
                
                <button onclick="app.showToast('Prescription saved to EHR file!', 'success')" class="w-full py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow">Finalize & Issue Rx</button>
              </div>
            </div>
          </div>
        `;
      },
      renderBilling(container) {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-xl font-bold text-slate-800 dark:text-white">Billing, Accounting & Receipts</h2>
              <button onclick="app.printDocument('invoice', 'inv_901')" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow"><i class="fa-solid fa-print mr-1"></i> Print Sample Receipt</button>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden text-xs">
              <table class="w-full text-left">
                <thead class="bg-slate-100 dark:bg-slate-700 font-bold uppercase">
                  <tr>
                    <th class="p-3">Receipt #</th>
                    <th class="p-3">Patient Name</th>
                    <th class="p-3">Date</th>
                    <th class="p-3">Total (PKR)</th>
                    <th class="p-3">Paid</th>
                    <th class="p-3">Status</th>
                    <th class="p-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                  ${state.db.invoices.map(i => `
                    <tr>
                      <td class="p-3 font-mono font-bold text-teal-600">${i.receiptNo}</td>
                      <td class="p-3 font-semibold text-slate-800 dark:text-white">${i.patientName}</td>
                      <td class="p-3 text-slate-500">${i.date}</td>
                      <td class="p-3 font-bold">${i.total.toLocaleString()} PKR</td>
                      <td class="p-3 text-emerald-600 font-bold">${i.paid.toLocaleString()} PKR</td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded font-bold text-[10px] ${i.status === 'Paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${i.status}</span></td>
                      <td class="p-3 text-right"><button onclick="app.printDocument('invoice', '${i.id}')" class="p-1 hover:text-teal-600"><i class="fa-solid fa-print"></i></button></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },
      renderPharmacy(container) {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Pharmacy Stock & Inventory Catalogue</h2>
            <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden text-xs">
              <table class="w-full text-left">
                <thead class="bg-slate-100 dark:bg-slate-700 font-bold uppercase">
                  <tr>
                    <th class="p-3">Code</th>
                    <th class="p-3">Medicine Name</th>
                    <th class="p-3">Category</th>
                    <th class="p-3">Batch</th>
                    <th class="p-3">Stock Level</th>
                    <th class="p-3">Unit Price</th>
                    <th class="p-3">Expiry</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                  ${state.db.pharmacy.map(p => `
                    <tr>
                      <td class="p-3 font-mono text-teal-600">${p.code}</td>
                      <td class="p-3 font-bold text-slate-800 dark:text-white">${p.name} <span class="text-[10px] text-slate-400">(${p.generic})</span></td>
                      <td class="p-3 text-slate-500">${p.category}</td>
                      <td class="p-3 font-mono">${p.batch}</td>
                      <td class="p-3 font-bold ${p.stock <= p.minStock ? 'text-rose-600' : 'text-emerald-600'}">${p.stock} ${p.unit}</td>
                      <td class="p-3 font-semibold">${p.unitPrice} PKR</td>
                      <td class="p-3 text-slate-500">${p.expiry}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },
      renderLab(container) {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Laboratory Diagnostic Orders & Reports</h2>
            <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden text-xs">
              <table class="w-full text-left">
                <thead class="bg-slate-100 dark:bg-slate-700 font-bold uppercase">
                  <tr>
                    <th class="p-3">Patient Name</th>
                    <th class="p-3">Test Requested</th>
                    <th class="p-3">Date</th>
                    <th class="p-3">Result / Value</th>
                    <th class="p-3">Reference Range</th>
                    <th class="p-3">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                  ${state.db.labOrders.map(l => `
                    <tr>
                      <td class="p-3 font-bold text-slate-800 dark:text-white">${l.patientName}</td>
                      <td class="p-3 text-teal-600 font-semibold">${l.testName}</td>
                      <td class="p-3 text-slate-500">${l.sampleDate}</td>
                      <td class="p-3 font-semibold">${l.resultValue}</td>
                      <td class="p-3 text-slate-400">${l.refRange}</td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded font-bold text-[10px] ${l.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${l.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },
      renderStaff(container) {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Staff Profiles & Role-Based Permissions</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              ${state.db.doctors.map(d => `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center font-bold"><i class="fa-solid fa-user-doctor"></i></div>
                    <div>
                      <h3 class="font-bold text-slate-800 dark:text-white">${d.name}</h3>
                      <p class="text-slate-500">${d.department}</p>
                    </div>
                  </div>
                  <p class="text-slate-600 dark:text-slate-300"><strong>Qual:</strong> ${d.qualification}</p>
                  <p class="text-slate-600 dark:text-slate-300"><strong>Fee:</strong> ${d.fee} PKR</p>
                  <p class="text-slate-600 dark:text-slate-300"><strong>Hours:</strong> ${d.schedule}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },
      renderReports(container) {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Clinical Analytics & Performance Reports</h2>
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 text-center text-xs space-y-3">
              <i class="fa-solid fa-chart-line text-4xl text-teal-600"></i>
              <h3 class="font-bold text-base text-slate-800 dark:text-white">Monthly Clinic Performance Summary</h3>
              <p class="text-slate-500">Total Consultations: 420 | Total Revenue: Rs 1,250,000 | Pharmacy Sales: Rs 380,000</p>
            </div>
          </div>
        `;
      },
      renderSettings(container) {
        container.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-800 dark:text-white">Clinic Branding & Database Migration Setup</h2>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs space-y-4">
              <h3 class="font-bold text-sm text-teal-700 dark:text-teal-400">PostgreSQL Migration Script (Supabase Ready)</h3>
              <textarea readonly class="w-full h-40 p-3 font-mono bg-slate-900 text-emerald-400 rounded-lg text-[11px]">
CREATE TABLE clinics (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), name TEXT, created_at TIMESTAMPTZ DEFAULT now());
CREATE TABLE patients (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), clinic_id UUID REFERENCES clinics(id), mrn TEXT UNIQUE, name TEXT, phone TEXT, cnic TEXT);
CREATE TABLE appointments (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), patient_id UUID REFERENCES patients(id), doctor_id UUID, date DATE, time TEXT, status TEXT);
              </textarea>
              <button onclick="app.showToast('SQL Migration Schema copied to clipboard!', 'success')" class="px-4 py-2 bg-teal-600 text-white font-bold rounded-lg shadow">Copy SQL Script</button>
            </div>
          </div>
        `;
      },
      showAddPatientModal() {
        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content');
        modalContainer.classList.remove('hidden');
        const autoMRN = 'MRN-20261024-00' + (state.db.patients.length + 1);
        modalContent.innerHTML = `
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h3 class="font-bold text-base text-slate-800 dark:text-white">Register New Patient (Comprehensive File)</h3>
            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>
          <form onsubmit="app.handleFullPatientSubmit(event)" class="space-y-4 text-xs">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label class="block font-semibold mb-1">MRN (Auto-Generated) *</label>
                <input type="text" id="pat-mrn" value="${autoMRN}" readonly class="w-full p-2 bg-slate-100 dark:bg-slate-700 font-bold text-teal-700 border rounded">
              </div>
              <div>
                <label class="block font-semibold mb-1">Full Patient Name *</label>
                <input type="text" id="pat-name" required placeholder="e.g. Tariq Mehmood" class="w-full p-2 border rounded dark:bg-slate-700">
              </div>
              <div>
                <label class="block font-semibold mb-1">CNIC / ID Number *</label>
                <input type="text" id="pat-cnic" required placeholder="35202-0000000-0" class="w-full p-2 border rounded dark:bg-slate-700">
              </div>
              <div>
                <label class="block font-semibold mb-1">Gender *</label>
                <select id="pat-gender" class="w-full p-2 border rounded dark:bg-slate-700">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label class="block font-semibold mb-1">Age (Years) *</label>
                <input type="number" id="pat-age" required value="35" class="w-full p-2 border rounded dark:bg-slate-700">
              </div>
              <div>
                <label class="block font-semibold mb-1">Phone Number *</label>
                <input type="text" id="pat-phone" required placeholder="+92 300 0000000" class="w-full p-2 border rounded dark:bg-slate-700">
              </div>
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 py-2.5 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-lg shadow">Save & Register Patient File</button>
              <button type="button" onclick="app.closeModal()" class="px-4 py-2.5 bg-slate-200 text-slate-700 rounded-lg">Cancel</button>
            </div>
          </form>
        `;
      },
      handleFullPatientSubmit(e) {
        e.preventDefault();
        const newPat = {
          id: 'pat_' + (state.db.patients.length + 1),
          mrn: document.getElementById('pat-mrn').value,
          name: document.getElementById('pat-name').value,
          gender: document.getElementById('pat-gender').value,
          age: parseInt(document.getElementById('pat-age').value),
          phone: document.getElementById('pat-phone').value,
          cnic: document.getElementById('pat-cnic').value,
          bloodGroup: 'B+',
          allergies: ['None'],
          insuranceProvider: 'Cash',
          status: 'Active',
          regDate: '2026-10-24'
        };
        state.db.patients.unshift(newPat);
        this.saveState();
        this.closeModal();
        this.showToast(`Patient Record created for ${newPat.name}`, 'success');
        this.navigate('patients');
      },
      closeModal() {
        document.getElementById('modal-container').classList.add('hidden');
      },
      printDocument(type, id) {
        const printableArea = document.getElementById('printable-area');
        if (type === 'prescription') {
          const rx = state.db.prescriptions.find(r => r.id === id) || state.db.prescriptions[0];
          const patient = state.db.patients.find(p => p.id === rx.patientId) || state.db.patients[0];
          printableArea.innerHTML = `
            <div class="max-w-3xl mx-auto border-2 border-teal-800 p-8 bg-white font-sans text-slate-900">
              <div class="border-b-2 border-teal-800 pb-4 mb-4 flex justify-between items-start">
                <div>
                  <h1 class="text-2xl font-bold text-teal-800 uppercase tracking-wide">${state.clinicConfig.name}</h1>
                  <p class="text-xs text-slate-600">${state.clinicConfig.address}</p>
                </div>
                <div class="text-right">
                  <h3 class="font-bold text-base text-slate-800">${rx.doctorName}</h3>
                  <p class="text-xs text-slate-600">Senior Consultant Physician</p>
                </div>
              </div>
              <div class="bg-slate-100 p-3 rounded text-xs grid grid-cols-4 gap-2 mb-4 font-medium border border-slate-200">
                <div><strong>MRN:</strong> ${patient.mrn}</div>
                <div><strong>Patient Name:</strong> ${patient.name}</div>
                <div><strong>Age/Gender:</strong> ${patient.age} Yrs / ${patient.gender}</div>
                <div><strong>Date:</strong> ${rx.date}</div>
              </div>
              <div class="mb-6">
                <h2 class="text-lg font-bold text-teal-800 mb-2 border-b pb-1">Rx (Prescribed Medications)</h2>
                <table class="w-full text-xs text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-200 border-b font-bold">
                      <th class="p-2">#</th>
                      <th class="p-2">Medicine Name & Strength</th>
                      <th class="p-2">Dosage Instructions</th>
                      <th class="p-2">Duration</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y">
                    ${rx.medicines.map((m, idx) => `
                      <tr>
                        <td class="p-2 font-bold">${idx + 1}</td>
                        <td class="p-2 font-bold text-slate-900">${m.name}</td>
                        <td class="p-2">${m.dosage}</td>
                        <td class="p-2">${m.duration}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else if (type === 'invoice') {
          const inv = state.db.invoices.find(i => i.id === id) || state.db.invoices[0];
          printableArea.innerHTML = `
            <div class="max-w-2xl mx-auto border p-8 bg-white font-sans text-slate-900">
              <div class="border-b-2 border-teal-700 pb-4 mb-4 flex justify-between">
                <div>
                  <h1 class="text-xl font-bold text-teal-800">${state.clinicConfig.name}</h1>
                  <p class="text-xs text-slate-600">${state.clinicConfig.address}</p>
                </div>
                <div class="text-right">
                  <h2 class="text-lg font-bold text-slate-800">TAX INVOICE / RECEIPT</h2>
                  <p class="text-xs text-slate-600">Receipt #: <strong>${inv.receiptNo}</strong></p>
                </div>
              </div>
              <div class="bg-slate-50 p-3 rounded text-xs mb-4">
                <p><strong>Billed To:</strong> ${inv.patientName}</p>
                <p><strong>Date:</strong> ${inv.date}</p>
              </div>
              <p class="text-base font-bold text-teal-800 text-right">Total Paid: ${inv.paid.toLocaleString()} PKR</p>
            </div>
          `;
        }
        window.print();
      }
    };
    window.addEventListener('DOMContentLoaded', () => window.app.init());
  </script>
</body>

</html>
