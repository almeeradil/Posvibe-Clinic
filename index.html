<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClinicOS Pro - Enterprise Medical SaaS & EHR System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdf4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a'
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a'
            },
            medical: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            urdu: ['Noto Nastaliq Urdu', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- FontAwesome & Chart.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');

    .rtl {
      direction: rtl;
      font-family: 'Noto Nastaliq Urdu', 'Inter', sans-serif;
    }

    .rtl .sidebar-icon {
      margin-left: 0.75rem;
      margin-right: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Print Stylesheet */
    @media print {
      body * {
        visibility: hidden;
      }

      #printable-area,
      #printable-area * {
        visibility: visible;
      }

      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
      }

      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

<body class="h-full text-slate-800 dark:text-slate-100 dark:bg-slate-900 antialiased flex flex-col font-sans transition-colors duration-200" id="app-body">

  <!-- LOGIN / AUTHENTICATION OVERLAY MODAL -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700 relative">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-gradient-to-tr from-teal-600 to-medical-500 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3 shadow-lg">
          <i class="fa-solid fa-user-md"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 dark:text-white">Welcome to ClinicOS Pro</h2>
        <p class="text-xs text-slate-500 mt-1">Enterprise Medical Management System</p>
      </div>

      <!-- Login / Signup Tabs -->
      <div class="flex border-b border-slate-200 dark:border-slate-700 mb-4">
        <button id="tab-login-btn" onclick="app.switchAuthTab('login')" class="flex-1 pb-2 text-xs font-bold text-teal-600 border-b-2 border-teal-600">Login</button>
        <button id="tab-signup-btn" onclick="app.switchAuthTab('signup')" class="flex-1 pb-2 text-xs font-bold text-slate-400 hover:text-slate-600">Register Staff / Doctor</button>
      </div>

      <!-- Login Form -->
      <form id="auth-login-form" onsubmit="app.handleLogin(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Email Address / Username</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="login-email" value="admin@clinicos.pk" required class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-teal-600 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400"></i>
            <input type="password" id="login-password" value="demo123" required class="w-full pl-9 pr-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-teal-600 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Login Role</label>
          <select id="login-role" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg font-medium">
            <option value="Super Admin">Super Admin</option>
            <option value="Clinic Owner">Clinic Owner</option>
            <option value="Doctor">Doctor / Consultant</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Nurse">Nurse Staff</option>
            <option value="Lab Technician">Lab Technician</option>
            <option value="Pharmacist">Pharmacist</option>
            <option value="Accountant">Accountant</option>
          </select>
        </div>
        <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-md transition">
          Sign In to Portal
        </button>
      </form>

      <!-- Signup Form (Hidden initially) -->
      <form id="auth-signup-form" onsubmit="app.handleSignup(event)" class="hidden space-y-3 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Full Name *</label>
          <input type="text" id="signup-name" placeholder="Dr. Ali Ahmed" required class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Role *</label>
          <select id="signup-role" onchange="app.toggleDoctorSignupFields(this.value)" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg font-medium">
            <option value="Doctor">Doctor / Specialist</option>
            <option value="Receptionist">Receptionist</option>
            <option value="Nurse">Nurse</option>
            <option value="Lab Technician">Lab Tech</option>
            <option value="Pharmacist">Pharmacist</option>
            <option value="Accountant">Accountant</option>
          </select>
        </div>
        <div id="doctor-signup-extra" class="space-y-2 border-t pt-2">
          <div>
            <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Qualification & Specialty</label>
            <input type="text" id="signup-qual" placeholder="MBBS, FCPS (Internal Med)" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Department</label>
              <input type="text" id="signup-dept" placeholder="General Med" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
            </div>
            <div>
              <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Consult Fee (PKR)</label>
              <input type="number" id="signup-fee" value="2500" class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
            </div>
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Email Address *</label>
          <input type="email" id="signup-email" required class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
        </div>
        <div>
          <label class="block font-semibold mb-1 text-slate-700 dark:text-slate-300">Password *</label>
          <input type="password" id="signup-password" required class="w-full p-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg">
        </div>
        <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-lg shadow-md transition">
          Create Account & Register
        </button>
      </form>
    </div>
  </div>

        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="flex items-center gap-2">

        </div>
        <div>
          <span class="text-lg font-bold text-slate-800 dark:text-white tracking-tight flex items-center gap-1.5">
            ClinicOS <span class="bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300 text-xs px-2 py-0.5 rounded-full font-semibold">Pro v3.2</span>
          </span>
          <p class="text-xs text-slate-500 dark:text-slate-400" id="current-branch-display"><i class="fa-solid fa-hospital-user text-teal-600 mr-1"></i> Main Branch - Lahore HQ</p>
        </div>
      </div>
    </div>

        <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=120" alt="Profile" class="w-8 h-8 rounded-full object-cover border border-teal-600">

        <button onclick="app.logout()" title="Sign Out" class="p-1.5 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-lg text-xs ml-1">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

          <div class="flex justify-between items-center text-slate-400 mb-1">
            <span>Today's Target</span>
            <span class="text-teal-400 font-bold">84%</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-1.5">
            <div class="bg-teal-500 h-1.5 rounded-full" style="width: 84%"></div>
          </div>
        </div>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-100 dark:bg-slate-900/60 space-y-6" id="main-content">

    </main>
  </div>

      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- PRINTABLE TEMPLATE HIDDEN CONTAINER -->
  <div id="printable-area" class="hidden bg-white text-slate-900 p-8"></div>

                                                <td class="p-3 text-slate-600 dark:text-slate-300">${p.cnic || 'N/A'}<br><span class="text-[10px] text-slate-400">${p.phone}</span></td>
                                                <td class="p-3 text-slate-600 dark:text-slate-300">${p.age} Yrs / ${p.gender}</td>
                                                <td class="p-3"><span class="px-1.5 py-0.5 bg-rose-100 text-rose-800 rounded font-bold text-[10px]">${p.bloodGroup}</span><br><span class="text-rose-600 text-[10px]">${p.allergies.join(', ')}</span></td>
                                                <td class="p-3 text-slate-600 dark:text-slate-300">${p.insuranceProvider}</td>
                                                <td class="p-3"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-[10px]">${p.status}</span></td>
                                                <td class="p-3 text-right space-x-1">
                                                    <button onclick="app.printDocument('prescription', 'rx_501')" class="p-1.5 text-slate-600 hover:text-teal-600" title="Print File"><i class="fa-solid fa-print"></i></button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
      }
    };
    // Initialize application
    window.addEventListener('DOMContentLoaded', () => window.app.init());
  </script>
</body>

</html>
